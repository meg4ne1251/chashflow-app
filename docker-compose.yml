services:
  # --- PostgreSQL ---
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kakeibo}
      POSTGRES_USER: ${POSTGRES_USER:-kakeibo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kakeibo} -d ${POSTGRES_DB:-kakeibo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Do not expose port externally in production
    # ports:
    #   - "5432:5432"

  # --- Backend (Ktor API) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-kakeibo}
      DATABASE_USER: ${POSTGRES_USER:-kakeibo}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      PORT: 8080
    # Do not expose port directly; nginx proxies requests
    # ports:
    #   - "8080:8080"

  # --- Nginx (reverse proxy + SPA host) ---
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${LISTEN_PORT:-80}:80"

volumes:
  pgdata:
    driver: local
