ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.kakeibo.backend.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/kakeibo"
    url = ${?DATABASE_URL}
    driver = "org.postgresql.Driver"
    user = "kakeibo"
    user = ${?DATABASE_USER}
    password = "kakeibo"
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10
    maxPoolSize = ${?DATABASE_MAX_POOL_SIZE}
}

jwt {
    secret = ${JWT_SECRET}
    issuer = "kakeibo-api"
    audience = "kakeibo-client"
    realm = "kakeibo"
}

cors {
    allowedOrigins = "http://localhost:5173"
    allowedOrigins = ${?CORS_ALLOWED_ORIGINS}
}
