global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'cashflow-backend'
    static_configs:
      - targets: ['app:8080']
    metrics_path: '/api/v1/metrics'
    scrape_interval: 10s

  # Prometheus自身のメトリクス
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
