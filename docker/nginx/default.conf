server_tokens off;

# --- 実クライアントプロトコルの判定 -----------------------------------------
# 本番では Cloudflare / Let's Encrypt の上流で TLS 終端され、実プロトコルは
# X-Forwarded-Proto で渡る。LAN/ローカルで nginx に直接 HTTP アクセスした場合は
# 空になるため $scheme (= http) にフォールバックする。
map $http_x_forwarded_proto $effective_scheme {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}

# HTTPS のときだけ HSTS と upgrade-insecure-requests を付与する。
# 平文 HTTP 直アクセス時にこれらを付けると、ブラウザがアセット取得を 443 番へ
# 格上げし、TLS サーバが居ないため ERR_CONNECTION_REFUSED になる。
map $effective_scheme $hsts_header {
    "https" "max-age=31536000; includeSubDomains";
    default "";
}
map $effective_scheme $csp_upgrade {
    "https" "upgrade-insecure-requests; ";
    default "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS / upgrade-insecure-requests は HTTPS のときのみ付与（上の map 参照）。
    # 本ファイルは 80 番でリッスンし、本番では上流 (Cloudflare / Let's Encrypt) で
    # TLS 終端される前提。平文 HTTP 直アクセス時は空文字となり header は付かない。
    add_header Strict-Transport-Security $hsts_header always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; ${csp_upgrade}report-uri /api/v1/csp-report" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- /metrics は外部公開しない ---
    # Prometheus は docker-compose ネットワーク内から app:8080 を直接スクレイプするため、
    # 外部からは常に 403 を返す (アプリ層のループバック/トークン検査と多層防御)。
    # `location =` の完全一致は前置 prefix match よりも優先される。
    location = /api/v1/metrics {
        deny all;
        return 403;
    }

    # --- API reverse proxy ---
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # リクエストボディ上限。
        # バックアップ復元 (`ValidationRules.MAX_BACKUP_FILE_SIZE = 50MB`) と整合させる。
        # CSV/Excel インポートは `ValidationRules.MAX_IMPORT_FILE_SIZE = 10MB`。
        client_max_body_size 50m;
    }

    # --- Static assets (hashed filenames: long cache) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; ${csp_upgrade}report-uri /api/v1/csp-report" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Block dotfiles ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
