name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kakeibo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Run backend tests
        run: ./gradlew :backend:test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/kakeibo_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: test
          JWT_SECRET: test-secret-key-at-least-32-characters-long
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/build/reports/tests/

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: web
      
      - name: Run lint
        run: npm run lint
        working-directory: web
      
      - name: Run type check
        run: npm run type-check
        working-directory: web
      
      - name: Build
        run: npm run build
        working-directory: web
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      
      - name: Run Gradle dependency check
        run: ./gradlew :backend:dependencies --scan
        continue-on-error: true

  build-images:
    needs: [test-backend, lint-frontend]
    runs-on: ubuntu-latest
    # コンテナレジストリへの publish は ENABLE_REGISTRY_PUBLISH リポジトリ変数を
    # 'true' に設定し、REGISTRY_URL / REGISTRY_USER / REGISTRY_PASSWORD シークレットを
    # 登録した場合のみ実行される。デフォルトはスキップ。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_REGISTRY_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/cashflow-app:${{ github.sha }}
            ${{ secrets.REGISTRY_URL }}/cashflow-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
